global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: growman-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: growman-api

  # Scrape backend when running on the host (go run / local dev).
  - job_name: growman-backend-host
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: growman-api

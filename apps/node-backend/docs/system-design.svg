<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#687078"/>
    </marker>
    <marker id="arrowDark" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#232f3e"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#553c9a"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrowNavy" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1a365d"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9b2c2c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#276749"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#f7f8fa"/>
  <text x="48" y="48" font-size="28" font-weight="700" fill="#16191f">Growman - scalable system design</text>
  <text x="48" y="76" font-size="14" fill="#545b64">Storefront and app call Node only. Node calls Dootha. Dootha has no database.</text>

  <text x="48" y="118" font-size="12" font-weight="700" fill="#687078">CLIENTS</text>
  <rect x="48" y="132" width="150" height="72" rx="8" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="123" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#16191f">Web</text>
  <text x="123" y="184" text-anchor="middle" font-size="12" fill="#545b64">Next.js</text>
  <rect x="214" y="132" width="150" height="72" rx="8" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="289" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#16191f">Android</text>
  <text x="289" y="184" text-anchor="middle" font-size="12" fill="#545b64">Expo</text>
  <rect x="380" y="132" width="150" height="72" rx="8" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="455" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#16191f">Admin</text>
  <text x="455" y="184" text-anchor="middle" font-size="12" fill="#545b64">same API</text>

  <line x1="263" y1="204" x2="263" y2="236" stroke="#687078" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="272" y="226" font-size="11" fill="#545b64">HTTPS</text>

  <rect x="48" y="236" width="482" height="64" rx="8" fill="#ff9900"/>
  <text x="289" y="264" text-anchor="middle" font-size="16" font-weight="700" fill="#16191f">Cloudflare edge</text>
  <text x="289" y="284" text-anchor="middle" font-size="12" fill="#16191f">Workers storefront | CDN | TLS</text>

  <line x1="289" y1="300" x2="289" y2="348" stroke="#687078" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="298" y="328" font-size="11" fill="#545b64">/api/v1</text>

  <rect x="36" y="348" width="1128" height="590" rx="12" fill="#ffffff" stroke="#879596" stroke-dasharray="6 4"/>
  <text x="56" y="376" font-size="12" font-weight="700" fill="#687078">PRODUCTION - AUTOSCALE</text>

  <rect x="168" y="392" width="240" height="52" rx="8" fill="#232f3e"/>
  <text x="288" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Load balancer</text>

  <line x1="248" y1="444" x2="200" y2="478" stroke="#232f3e" stroke-width="1.4" marker-end="url(#arrowDark)"/>
  <line x1="288" y1="444" x2="288" y2="478" stroke="#232f3e" stroke-width="1.4" marker-end="url(#arrowDark)"/>
  <line x1="328" y1="444" x2="376" y2="478" stroke="#232f3e" stroke-width="1.4" marker-end="url(#arrowDark)"/>

  <rect x="120" y="478" width="150" height="78" rx="8" fill="#232f3e"/>
  <text x="195" y="508" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="13">Node API</text>
  <text x="195" y="528" text-anchor="middle" fill="#ff9900" font-size="11">Express | Prisma</text>
  <rect x="288" y="478" width="150" height="78" rx="8" fill="#232f3e"/>
  <text x="363" y="508" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="13">Node API</text>
  <text x="363" y="528" text-anchor="middle" fill="#ff9900" font-size="11">replica</text>
  <rect x="456" y="478" width="150" height="78" rx="8" fill="#232f3e"/>
  <text x="531" y="508" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="13">Node API</text>
  <text x="531" y="528" text-anchor="middle" fill="#ff9900" font-size="11">replica</text>
  <text x="363" y="576" text-anchor="middle" font-size="11" fill="#545b64">In-process workers: unpaid stock | shipments | retention</text>

  <rect x="680" y="392" width="440" height="164" rx="8" fill="#f4f0ff" stroke="#6b46c1"/>
  <text x="700" y="416" font-size="12" font-weight="700" fill="#553c9a">DOOTHA - apps/ai</text>
  <rect x="700" y="432" width="190" height="72" rx="8" fill="#553c9a"/>
  <text x="795" y="462" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="14">RAG service</text>
  <text x="795" y="482" text-anchor="middle" fill="#e9d8fd" font-size="11">FastAPI replica</text>
  <rect x="908" y="432" width="190" height="72" rx="8" fill="#553c9a"/>
  <text x="1003" y="462" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="14">RAG service</text>
  <text x="1003" y="482" text-anchor="middle" fill="#e9d8fd" font-size="11">BM25 | BGE | RRF | rerank</text>
  <text x="900" y="532" text-anchor="middle" font-size="11" fill="#553c9a">No Postgres. Gemini only for route fallback and comparisons.</text>

  <line x1="606" y1="510" x2="700" y2="468" stroke="#553c9a" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="620" y="486" font-size="11" fill="#553c9a">shared secret</text>
  <line x1="700" y1="500" x2="606" y2="540" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="640" y="548" font-size="11" fill="#2b6cb0">live prices</text>

  <text x="56" y="620" font-size="12" font-weight="700" fill="#687078">DATA</text>
  <rect x="56" y="636" width="250" height="88" rx="8" fill="#1a365d"/>
  <text x="181" y="670" text-anchor="middle" fill="#ffffff" font-weight="700">Postgres</text>
  <text x="181" y="692" text-anchor="middle" fill="#90cdf4" font-size="12">orders | stock | users</text>
  <text x="181" y="708" text-anchor="middle" fill="#90cdf4" font-size="11">single writer</text>

  <rect x="326" y="636" width="250" height="88" rx="8" fill="#9b2c2c"/>
  <text x="451" y="670" text-anchor="middle" fill="#ffffff" font-weight="700">Redis</text>
  <text x="451" y="692" text-anchor="middle" fill="#fed7d7" font-size="12">catalog cache | limits</text>
  <text x="451" y="708" text-anchor="middle" fill="#fed7d7" font-size="11">optional | L1 still serves</text>

  <rect x="596" y="636" width="250" height="88" rx="8" fill="#276749"/>
  <text x="721" y="670" text-anchor="middle" fill="#ffffff" font-weight="700">Object storage</text>
  <text x="721" y="692" text-anchor="middle" fill="#c6f6d5" font-size="12">image keys, not URLs</text>
  <text x="721" y="708" text-anchor="middle" fill="#c6f6d5" font-size="11">GCS</text>

  <line x1="288" y1="556" x2="181" y2="636" stroke="#1a365d" stroke-width="1.3" marker-end="url(#arrowNavy)"/>
  <line x1="363" y1="556" x2="451" y2="636" stroke="#9b2c2c" stroke-width="1.3" marker-end="url(#arrowRed)"/>
  <line x1="470" y1="556" x2="680" y2="636" stroke="#276749" stroke-width="1.3" marker-end="url(#arrowGreen)"/>

  <text x="56" y="760" font-size="12" fill="#545b64">Stock is a conditional UPDATE in Postgres. Redis never owns the last plant.</text>
  <text x="56" y="782" font-size="12" fill="#545b64">Webhooks (Razorpay, Shiprocket) hit the load balancer with HMAC, outside the shopper rate limit.</text>
  <text x="56" y="804" font-size="12" fill="#545b64">Health: /healthz is liveness. /readyz pings Postgres. Redis down is degraded, not down.</text>
  <text x="56" y="860" font-size="13" font-weight="700" fill="#16191f">Scale path</text>
  <text x="56" y="884" font-size="12" fill="#545b64">Add Node replicas behind the balancer. Add Dootha replicas on their own service. Keep one Postgres writer.</text>
  <text x="56" y="906" font-size="12" fill="#545b64">Put a CDN on public catalog GETs. Move vectors to pgvector only after the corpus outgrows memory.</text>

  <text x="1208" y="376" font-size="12" font-weight="700" fill="#687078">OUTSIDE</text>
  <rect x="1208" y="392" width="180" height="40" rx="8" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="1298" y="417" text-anchor="middle" font-size="13" fill="#16191f">Razorpay</text>
  <rect x="1208" y="442" width="180" height="40" rx="8" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="1298" y="467" text-anchor="middle" font-size="13" fill="#16191f">Shiprocket</text>
  <rect x="1208" y="492" width="180" height="40" rx="8" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="1298" y="517" text-anchor="middle" font-size="13" fill="#16191f">MSG91 OTP</text>
  <rect x="1208" y="542" width="180" height="40" rx="8" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="1298" y="567" text-anchor="middle" font-size="13" fill="#16191f">Truecaller</text>
  <rect x="1208" y="592" width="180" height="40" rx="8" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="1298" y="617" text-anchor="middle" font-size="13" fill="#16191f">Google sign-in</text>
  <rect x="1208" y="642" width="180" height="40" rx="8" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="1298" y="667" text-anchor="middle" font-size="13" fill="#16191f">PlantNet</text>
  <rect x="1208" y="692" width="180" height="40" rx="8" fill="#ffffff" stroke="#6b46c1"/>
  <text x="1298" y="717" text-anchor="middle" font-size="13" fill="#16191f">Gemini</text>
  <rect x="1208" y="742" width="180" height="40" rx="8" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="1298" y="767" text-anchor="middle" font-size="13" fill="#16191f">Email SMTP</text>

  <line x1="1164" y1="520" x2="1208" y2="412" stroke="#879596" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1120" y1="500" x2="1208" y2="712" stroke="#553c9a" stroke-width="1.2" marker-end="url(#arrowPurple)"/>
  <text x="1208" y="810" font-size="11" fill="#545b64">Node calls every box except Gemini.</text>
  <text x="1208" y="828" font-size="11" fill="#553c9a">Only Dootha calls Gemini.</text>
  <text x="1208" y="860" font-size="11" fill="#545b64">Each one can fail without</text>
  <text x="1208" y="878" font-size="11" fill="#545b64">taking the catalog down.</text>
  <text x="1208" y="896" font-size="11" fill="#545b64">Payment checks fail closed.</text>
</svg>

  /api/v1/images/identify-plant:
    post:
      tags: [Images]
      summary: Identify a plant and return care context
      description: |
        One to five JPEG or PNG photos of the same plant. Species identification
        spends one Pl@ntNet credit (free plan: 500/day, shared with disease and
        variety scans). `focus=care` (default) also requests diseases while the
        remaining daily balance is above the reserve, and varieties only when
        the species is in the variety catalog. The same photo is cached until
        00:00 UTC.

        `bestMatch` and `results` are the Pl@ntNet species payload. `species`,
        `origin`, `care`, `health`, `varieties`, `flora`, and `quota` are added
        by this API. Origin is from GBIF. Care text is generated guidance, not
        a Pl@ntNet field.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One to five JPEG or PNG images (`image` or `images`)
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                organs:
                  type: array
                  items:
                    type: string
                    enum: [auto, flower, leaf, fruit, bark]
                focus:
                  type: string
                  enum: [care, species, health, variety, full]
                  default: care
                project:
                  type: string
                  description: Flora slug. Defaults to PLANTNET_PROJECT, or the nearest k- flora when lat and lon are set.
                lat:
                  type: number
                lon:
                  type: number
                nb-results:
                  type: string
                  description: 1–10, default 5
                lang:
                  type: string
                  default: en
                detailed:
                  type: string
                  description: "true to include family and genus results"
                related-images:
                  type: string
                no-reject:
                  type: string
      responses:
        "200":
          description: Species identification plus origin, care, health, and varieties
          content:
            application/json:
              schema:
                type: object
                properties:
                  bestMatch:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                  flora:
                    type: string
                  species:
                    type: object
                  origin:
                    type: object
                  care:
                    type: object
                  health:
                    type: object
                  varieties:
                    type: object
                  quota:
                    type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/plants/status:

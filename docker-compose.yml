version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: growman-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-growman}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - growman-network

  redis:
    image: redis:7-alpine
    container_name: growman-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - growman-network

  backend:
    build:
      context: ./apps/go-backend
      dockerfile: Dockerfile
    container_name: growman-backend
    environment:
      GO_PORT: ${GO_PORT:-:8080}
      GO_ENV: ${GO_ENV:-production}
      # DATABASE_URL - using default values that match postgres service
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/growman?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - growman-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: growman-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - growman-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: growman-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - growman-network
    restart: unless-stopped

  # Frontend dockerization commented out for now
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: ./apps/web/Dockerfile
  #   container_name: growman-frontend
  #   environment:
  #     NODE_ENV: production
  #     NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
  #     REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  #     RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  #     RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  #     NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
  #   ports:
  #     - "3001:3001"
  #   depends_on:
  #     - backend
  #     - redis
  #   networks:
  #     - growman-network
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  growman-network:
    driver: bridge

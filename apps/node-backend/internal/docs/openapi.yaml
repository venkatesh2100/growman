          $ref: "#/components/responses/Error"

  /api/v1/wishlist/{productId}:
    delete:
      tags: [Wishlist]
      summary: Remove product from wishlist
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:

openapi: 3.0.3
info:
  title: Growman Backend API
  description: |
    REST API for the Growman e-commerce platform (catalog, auth, checkout, orders, plant ID, and admin).

    **Interactive docs**
    - Swagger UI: `/docs`
    - ReDoc: `/redoc`
    - Raw spec: `/openapi.yaml`

    Authenticated routes expect `Authorization: Bearer <jwt>`. Use **Authorize** in Swagger after login.
  version: 1.0.0
  contact:
    name: Growman
servers:
  - url: /
    description: Current host
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
    description: Liveness and version
  - name: Auth
    description: Login, signup, OTP, Google, Truecaller, profile
  - name: Products
    description: Catalog product CRUD and search
  - name: Categories
    description: Categories, subcategories, and products in them
  - name: Brands
  - name: Catalog
    description: Combined tags and categories for shop filters
  - name: Images
    description: Image upload and plant identification
  - name: Chat
    description: AI shopping assistant
  - name: Checkout
    description: Guest checkout with email OTP, delivery quotes, and coupons
  - name: Payments
    description: Razorpay orders and verification
  - name: Orders
  - name: Reviews
    description: Product reviews and admin moderation
  - name: Inventory
    description: Stock adjustments, low-stock reporting, and restock alerts
  - name: Coupons
    description: Discount codes and admin coupon CRUD
  - name: Refunds
    description: Cancellations and refunds
  - name: Invoicing
    description: GST tax invoices and return-filing reports
  - name: Shipments
    description: Courier booking and pickup (Shiprocket)
  - name: Addresses
    description: Customer address book
  - name: Privacy
    description: DPDP Act consent, data export, and erasure
  - name: Wishlist
  - name: Requested Products
    description: Demand for missing products
  - name: Dootha Waitlist
    description: Dootha Care device waiting list
  - name: Order Support
    description: Admin order-support tickets
  - name: Dashboard
    description: Admin analytics maps
  - name: Webhooks
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Process health check
      description: >
        Liveness only: it reports that the process is up and serving and
        deliberately touches no datastore, so a database blip cannot cause
        the orchestrator to restart otherwise-healthy pods. Use /readyz to
        decide whether to route traffic here.
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe with dependency checks
      description: >
        Pings Postgres and Redis with a 2 second budget. An unreachable
        Postgres is `503` with status `down`, because a worker that cannot
        query the database cannot serve a request and should leave the
        rotation. Redis is reported but never fatal — the codebase treats it
        as optional throughout (caching falls back in-process, rate limiting
        degrades), so a Redis failure is status `degraded` with a `200`.
      security: []
      responses:
        "200":
          description: Ready, with status `ok` or `degraded`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Postgres is unreachable; status is `down`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /api/v1/healthz:
    get:
      tags: [Health]
      summary: API health check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/debug/version:
    get:
      tags: [Health]
      summary: Build and server time
      security: []
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time:
                    type: string
                    example: "2026-08-30T00:56:00+05:30"
                  built_at:
                    type: string
                    example: "2026-03-09-v2"
                  git:
                    type: string

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email or phone and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: JWT and user summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/admin/login:
    post:
      tags: [Auth]
      summary: Admin login (admin or superadmin role required)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/auth/signup:
    post:
      tags: [Auth]
      summary: Create a local account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "200":
          description: JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/auth/google:
    post:
      tags: [Auth]
      summary: Login or signup with a Google ID/access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleAuthRequest"
      responses:
        "200":
          description: JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/google-signup:
    post:
      tags: [Auth]
      summary: Google signup (same token flow as Google login)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleAuthRequest"
      responses:
        "200":
          description: JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /api/v1/auth/forgot-password/send-otp:
    post:
      tags: [Auth]
      summary: Send password-reset OTP to email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Always succeeds (does not reveal whether the email exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/v1/auth/forgot-password/verify-otp:
    post:
      tags: [Auth]
      summary: Verify password-reset OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
      responses:
        "200":
          description: OTP valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/auth/forgot-password/reset:
    post:
      tags: [Auth]
      summary: Reset password after OTP verification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
                confirmPassword:
                  type: string
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/auth/otp/send:
    post:
      tags: [Auth]
      summary: Send phone OTP (MSG91)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: 10-digit Indian mobile number
                  example: "9876543210"
                reqId:
                  type: string
                  description: When set, treated as a resend/retry
                channel:
                  type: string
                  description: Retry channel (11 SMS, 4 VOICE, 12 WHATSAPP)
                retryChannel:
                  type: string
                  description: Alias for channel
      responses:
        "200":
          description: OTP sent (or cooldown / already-registered token)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify phone OTP and issue JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone:
                  type: string
                otp:
                  type: string
                reqId:
                  type: string
      responses:
        "200":
          description: JWT; new users may have onboarding scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneAuthResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/otp/widget/verify:
    post:
      tags: [Auth]
      summary: Verify MSG91 widget access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessToken]
              properties:
                accessToken:
                  type: string
                identifier:
                  type: string
                  description: Optional phone hint from the widget
      responses:
        "200":
          description: JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneAuthResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/truecaller:
    post:
      tags: [Auth]
      summary: Truecaller OAuth (Android) → JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorizationCode, codeVerifier]
              properties:
                authorizationCode:
                  type: string
                codeVerifier:
                  type: string
      responses:
        "200":
          description: JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneAuthResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/auth/check-user:
    get:
      tags: [Auth]
      summary: Check whether a user exists by email and/or phone
      security: []
      parameters:
        - in: query
          name: email
          schema:
            type: string
        - in: query
          name: phone
          schema:
            type: string
      responses:
        "200":
          description: Existence flag and matched identifiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                  email:
                    type: string
                  phone:
                    type: string
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/auth/profile:
    put:
      tags: [Auth]
      summary: Update profile and address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/profile/complete:
    post:
      tags: [Auth]
      summary: Complete phone onboarding (onboarding-scope JWT required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Full-scope JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneAuthResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/auth/save-location:
    post:
      tags: [Auth]
      summary: Save address and coordinates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveLocationRequest"
      responses:
        "200":
          description: Location saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/products:
    get:
      tags: [Products]
      summary: List products (paginated)
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags: [Products]
      summary: Create a product
      description: Optionally create a new category or subcategory via `newCategory` / `newSubcategory`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "200":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/products/search:
    get:
      tags: [Products]
      summary: Search products by query
      security: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search query
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"

  /api/v1/products/featured:
    get:
      tags: [Products]
      summary: Featured products
      security: []
      responses:
        "200":
          description: Featured product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /api/v1/products/{slug}:
    get:
      tags: [Products]
      summary: Get product by slug
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [Products]
      summary: Update product by slug
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Products]
      summary: Delete product by slug
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/products/{slug}/related:
    get:
      tags: [Products]
      summary: Related products for a slug
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Related products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/products/{slug}/reviews:
    get:
      tags: [Reviews]
      summary: Approved reviews for a product
      description: >
        Only approved reviews are returned, newest first, with verified
        purchases ahead of unverified ones at equal age. Reviewer identity
        is reduced to a first name: a full name next to a delivery address
        is more personal data than a product page needs. The histogram is
        the 1-5 star bar chart, and ratingAverage/ratingCount are read from
        the product's denormalised aggregate rather than recomputed here.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Approved reviews with the product's rating summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductReviewsResponse"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags: [Reviews]
      summary: Write or update a review (full-scope JWT required)
      description: >
        One review per customer per product: re-submitting updates the
        existing row and returns it to moderation. A review from a customer
        with a paid order containing the product is marked
        verifiedPurchase and auto-approves; anything else lands as
        `pending` and is invisible until an admin approves it. Comment is
        truncated at 4000 characters, title at 140, and imageKeys at five
        entries. Requires a completed account — an onboarding-scope token
        has no verified identity to attach to a review.
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "200":
          description: Review saved, with the status it landed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                    enum: [pending, approved]
                  message:
                    type: string
                  review:
                    $ref: "#/components/schemas/PublicReview"
        "400":
          description: Rating is outside 1-5
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/products/{slug}/back-in-stock:
    post:
      tags: [Inventory]
      summary: Subscribe to a restock notification
      description: >
        Emails the address when the item has stock again, and doubles as a
        demand signal for what to propagate next. The product is identified
        by `productId` in the body; the slug in the path is the page the
        request came from. A repeat sign-up for the same product and email
        is not an error — the existing pending row is kept rather than
        duplicated. When a Bearer token is present the row is also linked
        to that account.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackInStockRequestBody"
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          description: productId missing, or the email is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/categories:
    get:
      tags: [Categories]
      summary: List categories
      security: []
      responses:
        "200":
          description: Categories with subcategories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /api/v1/categories/{slug}:
    get:
      tags: [Categories]
      summary: Get category by slug
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/categories/{slug}/products:
    get:
      tags: [Categories]
      summary: Products in a category
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/categories/{slug}/subcategories:
    get:
      tags: [Categories]
      summary: List subcategories of a category
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Subcategories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subcategory"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/categories/{slug}/subcategories/{subSlug}/products:
    get:
      tags: [Categories]
      summary: Products in a subcategory
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - in: path
          name: subSlug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/brands:
    get:
      tags: [Brands]
      summary: List brands
      security: []
      responses:
        "200":
          description: Brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"

  /api/v1/tags:
    get:
      tags: [Catalog]
      summary: Unique product tags
      security: []
      responses:
        "200":
          description: Sorted tag names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/v1/catalog:
    get:
      tags: [Catalog]
      summary: Tags and categories for shop filters

      responses:
        "201":
          description: Created coupon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"
        "400":
          description: Missing or over-long code, a value outside its type's range, or an expiry before the start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: A coupon with that code already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/coupons/{id}:
    put:
      tags: [Coupons]
      summary: Update a discount code (admin)
      description: "`usageCount` is not editable; the stored redemption count is preserved."
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:

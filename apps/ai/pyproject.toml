[project]
name = "growman-ai"
version = "0.1.0"
description = "Dootha hybrid RAG service for Growman"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2",
  "pydantic-settings>=2",
  "httpx>=0.27",
  "redis>=5",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "langchain-core>=0.3",
  "langchain>=0.3",
  "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
models = [
  "sentence-transformers>=3.0",
  "langchain-community>=0.3",
  "langchain-huggingface>=0.1",
  "langchain-google-genai>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

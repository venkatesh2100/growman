                $ref: "#/components/schemas/Coupon"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Coupons]
      summary: Delete a discount code (admin)
      description: >
        A soft delete: redemption history is preserved so past orders stay

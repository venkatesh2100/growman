  /api/v1/requested-products:
    post:
      tags: [Requested Products]
      summary: Request a missing product
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequestedProductRequest"
      responses:
        "201":

[project]
name = "growman-py-backend"
version = "0.1.0"
description = "Growman API — FastAPI shop for plants, payments, and care"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pyjwt>=2.10",
  "redis>=5.2",
  "httpx>=0.27",
  "bcrypt>=4.2",
  "prometheus-client>=0.21",
  "python-multipart>=0.0.17",
  "fpdf2>=2.8",
  "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
growman-api = "app.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/checkout/send-email-otp:
    post:
      tags: [Checkout]
      summary: Send checkout email OTP (new users only)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "409":
          description: Existing user must log in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Cooldown
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: otp_cooldown
                  retry_after:
                    type: integer

  /api/v1/checkout/verify-email-otp:
    post:
      tags: [Checkout]
      summary: Verify checkout email OTP and mint a verification proof
      description: >
        Single-use: a successful check deletes the stored OTP. The response
        carries a `verificationToken`, a short-lived single-use proof that
        this address was verified, which /checkout/create-order requires
        from guests. Without it the OTP step would be advisory and the
        order endpoint would write orders for any address. The token is
        bound to this one email and expires after `expiresIn` seconds.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
      responses:
        "200":
          description: OTP verified, with the proof token for order creation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  verificationToken:
                    type: string
                    description: 64 hex characters; pass as `verificationToken` to /checkout/create-order
                    example: 9f1c7e2a4b6d8f0a1c3e5d7b9f1a3c5e7d9b1f3a5c7e9d1b3f5a7c9e1d3b5f7a
                  expiresIn:
                    type: integer
                    description: Token lifetime in seconds
                    example: 900
        "400":
          description: Invalid email format, or an invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/checkout/quote:
    post:
      tags: [Checkout]
      summary: Quote delivery options for a cart
      description: >
        Returns which fulfillment channels are available for a cart and
        destination, what each costs, and which one to present first.
        Prices and plant size classes are read from the database, so the
        fee cannot be influenced by the request. Read-only; safe to call on
        every cart or address change.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FulfillmentQuoteRequest"
      responses:
        "200":
          description: Available channels and fees
          content:
            application/json:
              schema:
                type: object
                properties:
                  quote:
                    $ref: "#/components/schemas/FulfillmentQuote"
                  courierProvider:
                    type: string
                    example: Shiprocket
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/checkout/create-order:
    post:
      tags: [Checkout]
      summary: Create Razorpay checkout order
      description: >
        The only way to start a payment. Everything that decides the amount
        is re-derived server-side: line prices come from the products and
        product_sizes tables (the `price` on each item is advisory and
        ignored), the delivery quote is re-run, and any coupon is
        re-evaluated.

        fulfillmentChannel is required. An earlier version treated it as
        optional and accepted the client's amount verbatim when it was
        absent, which made the whole repricing check skippable by omitting
        one field.

        Guests must present the `verificationToken` from
        /checkout/verify-email-otp; it is consumed here, bound to the
        customer email, and single-use. A signed-in caller is already
        verified by its JWT and may omit the token.

        Stock is reserved from order creation rather than from payment, so
        two shoppers cannot both reach the payment screen for the last
        plant. The order row, its stock reservation and any coupon
        redemption commit in one transaction. An unpaid order's reservation
        is returned by the abandoned-order sweep after 30 minutes.

        `publicToken` in the response is an opaque handle, returned once,
        that lets a guest read the order back from `GET /order?token=` and
        download its invoice.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutOrderRequest"
      responses:
        "200":
          description: Razorpay order plus the local order id and its public token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RazorpayCreateResponse"
        "400":
          description: >
            Invalid customer details, an empty cart, a non-positive amount,
            an unknown or non-payable channel, or — as
            `fulfillment_channel_required` — no delivery option chosen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutChannelRequiredError"
        "403":
          description: >
            `email_not_verified`: the guest's proof token was missing,
            expired or already spent. Send the OTP again and retry with a
            fresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutEmailNotVerifiedError"
        "409":
          description: >
            The chosen channel can no longer serve this address
            (`channel_unavailable`, with `reason`), the amount disagrees
            with the server's (`amount_mismatch`, with `expectedAmount`),
            or a line is no longer in stock (`out_of_stock`). The first two
            return the current `quote` so the client can re-present the
            options; `out_of_stock` lists the offending lines in `items`
            when caught up front, or explains in `reason` when the
            reservation itself lost the race.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CheckoutQuoteConflict"
                  - $ref: "#/components/schemas/OutOfStockError"
        "422":
          description: >
            `coupon_rejected`: the code is not valid for this cart, this
            customer or right now, or the discount would take the order
            below the 1 rupee Razorpay minimum. `reason` is customer-facing
            copy explaining which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponRejectedError"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/checkout/validate-coupon:
    post:
      tags: [Coupons]
      summary: Preview a coupon against a cart
      description: >
        Returns the discount the server is willing to honour so checkout
        can show it before payment. Read-only: nothing is redeemed here and
        the same evaluation runs again at order creation, so the client's
        claimed discount is never an input to the amount charged. The
        subtotal is computed from database prices. Per-customer usage caps
        use the Bearer token's user when one is present and fall back to
        `email` for guests.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateCouponRequest"
      responses:
        "200":
          description: The discount this code earns on this cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  discount:
                    $ref: "#/components/schemas/CouponDiscount"
                  subtotal:
                    type: number
                  newTotal:
                    type: number
                    description: Goods subtotal after the discount, excluding delivery
        "400":
          description: Empty cart, or a product or size that does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`coupon_rejected`, with customer-facing copy in `reason`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponRejectedError"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/razorpay/verify:
    post:
      tags: [Payments]
      summary: Verify Razorpay payment signature
      description: >
        Confirms the browser's checkout callback and marks the order paid.
        The order is loaded first, so the signature is checked against the
        `razorpay_order_id` the server stored at creation rather than the
        one posted — otherwise a caller could supply any order id and have
        it verified against itself.

        `razorpay_signature` is required and a failed check is refused
        outright: Razorpay's guidance is explicit that a bad signature means
        do not fulfil and do not retry. Verification is only ever skipped
        when APP_ENV is explicitly `development`, `dev` or `test`; a missing
        key secret does not disable it, because a misconfigured production
        deployment must fail closed.

        Idempotent. This and the Razorpay webhook both funnel through the
        same paid transition, so an order is confirmed and the customer
        notified exactly once however it gets there.

        Identify the order with `orderId` where possible; `razorpay_order_id`
        is accepted as a fallback.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentRequest"
      responses:
        "200":
          description: Payment verified and the order marked paid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  orderId:
                    type: integer
                    description: Local database order id
                  publicToken:
                    type: string
                    description: Opaque handle for guest order lookup
        "400":
          description: >
            `razorpay_payment_id` missing, neither `orderId` nor
            `razorpay_order_id` supplied, `razorpay_signature` missing, or
            the signature did not verify ("payment verification failed").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/order:
    get:
      tags: [Orders]
      summary: Get a single order by public token or by id
      description: >
        Two ways in, never a bare id. A guest passes `?token=` — the
        order's `publicToken`, 64 hex characters, minted once by
        /checkout/create-order and scoped to that one order. A signed-in
        customer passes `?id=` with a Bearer token and may read only their
        own orders; an admin may read any.

        An order that does not exist and an order belonging to someone else
        return an identical `404`. Order ids are sequential integers, so
        distinguishing the two would let the whole order table be
        enumerated — including customer name, phone, email and address.
        Serving orders by id alone is exactly how that used to be possible.

        Authentication is optional on this route so one handler can serve
        both the signed-in owner and the token-bearing guest.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - in: query
          name: token
          schema:
            type: string
            minLength: 32
          description: The order's publicToken (64 hex characters). Authorises on its own.
        - in: query
          name: id
          schema:
            type: string
          description: Internal order id. Requires a Bearer token whose user owns the order, or an admin.
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Neither token nor id supplied, or the token is too short to be one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "`?id=` was used without a Bearer token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such order, or not this caller's order. The two are indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/orders/{id}/invoice:
    get:
      tags: [Invoicing]
      summary: Download an order's GST tax invoice as a PDF
      description: >
        Access matches GET /order: a `?token=` holder, the authenticated
        owner, or an admin. Available once the order is paid (or has been
        refunded); anything earlier is a `409`.

        Catalogue prices are GST-inclusive, so the invoice extracts tax
        rather than adding it: for an inclusive price P at rate r the
        taxable value is P / (1 + r/100) and the tax is the remainder.
        Invoice numbers look like `GRW/2026-27/000123` and are namespaced by
        Indian financial year (April to March). The number is allocated on
        the order's first paid transition and stays stable across
        re-downloads; an order paid before invoicing existed has one
        back-filled on the first download.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - in: query
          name: token
          schema:
            type: string
            minLength: 32
          description: The order's publicToken, for guests. Omit it to be authorised by Bearer token instead.
      responses:
        "200":
          description: The tax invoice PDF, served inline and never cached
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: The supplied token is too short to be an order token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No token supplied and no Bearer token present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such order, or not this caller's order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The order is not paid, so it has no invoice yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/orders:
    get:
      tags: [Orders]
      summary: List orders for the current user (admins see all unless scope=self)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: orderId
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: scope
          schema:
            type: string
            enum: [self]
          description: Admins pass `self` to list only their own orders
      responses:
        "200":
          description: Paginated orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOrders"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update order status (admin)
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum:
                    - pending
                    - confirmed
                    - shipped
                    - out_for_delivery
                    - delivered
                    - cancelled
                    - failed
                    - paid
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/orders/{id}/expected-delivery:
    patch:
      tags: [Orders]
      summary: Update expected delivery date (admin)
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedDeliveryDate:
                  type: string
                  description: YYYY-MM-DD, or empty to clear
                  example: "2026-09-15"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/orders/{id}/cancel:
    post:
      tags: [Refunds]
      summary: Cancel an order before dispatch
      description: >
        The customer may cancel their own order; an admin may cancel any.
        Cancellation is allowed while the order is pending, paid, confirmed
        or processing, and refused once an AWB has been assigned or the
        parcel has shipped — at that point it is a return, not a
        cancellation.

        The cancellation and the restock commit in one transaction, then the
        refund is requested. If the refund call fails the order still stays
        cancelled and an order-support request is raised for a human: a
        cancelled-but-unrefunded order is recoverable, a
        refunded-but-still-open one is not. In that case `refund` is
        `pending_manual` rather than a refund object.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional; defaults to customer_cancelled
      responses:
        "200":
          description: Order cancelled, with the refund if one was raised
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                    example: cancelled
                  message:
                    type: string
                  refund:
                    oneOf:
                      - $ref: "#/components/schemas/Refund"
                      - type: string
                        enum: [pending_manual]
                    description: Omitted when the order was never paid
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: No such order, or not this caller's order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`not_cancellable`: the order has already shipped or been cancelled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotCancellableError"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/orders/{id}/refund:
    post:
      tags: [Refunds]
      summary: Refund an order in full or in part (admin)
      description: >
        The local refund row is written before Razorpay is called, so a
        provider timeout can never move money with no record of it. The row
        starts `pending` and is advanced to `processed` or `failed` by the
        refund webhooks, which are authoritative; the synchronous API
        response is only used to capture the provider's refund id. A failed
        provider call therefore leaves a visible `failed` row for ops.

        Omit `amount` (or send zero) to refund the full remaining balance.
        `restock` is off by default: a plant refunded as damaged is usually
        not resellable.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
      responses:
        "200":
          description: Refund recorded and requested from the provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  refund:
                    $ref: "#/components/schemas/Refund"
        "400":
          description: Invalid order id, or a reason outside the allowed set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: >
            The order is not paid, has no captured payment, is already
            fully refunded, or the amount exceeds what remains.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/orders/{id}/invoice/email:
    post:
      tags: [Invoicing]
      summary: Email an order's invoice to the customer (admin)
      description: >
        For reissues and for orders that predate automatic invoicing. An
        order without an invoice number has one allocated before the PDF is
        rendered.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Invoice emailed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  invoiceNumber:
                    type: string
                    example: GRW/2026-27/000123
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The order has no customer email to send to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          description: The invoice email could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/orders/{id}/shipment:
    post:
      tags: [Shipments]
      summary: Book a courier shipment and assign an AWB (admin)
      description: >
        Creates the provider order and assigns an AWB in one call, because
        an order without an AWB is not trackable and so not useful. The
        provider's shipment id is persisted before the AWB is requested, so
        a retry after a partial failure does not create a second provider
        order.

        Idempotent: an order that already has an AWB is returned as-is with
        `alreadyDone` set rather than double-booked. Only a paid, uncancelled
        order on the `courier` channel can be booked. A background worker
        books pending shipments every 15 minutes, so this is mostly for
        forcing one through early or retrying a failure.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Shipment booked, or already booked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  alreadyDone:
                    type: boolean
                    description: Present and true when the order already had an AWB
                  awbNumber:
                    type: string
                  courier:
                    type: string
                    description: The carrier the aggregator picked
                  trackingUrl:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          description: >
            The courier rejected the booking — commonly an unpaid or
            cancelled order, or a channel other than courier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The courier integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/orders/{id}/shipment/pickup:
    post:
      tags: [Shipments]
      summary: Schedule the courier pickup for a booked shipment (admin)
      description: >
        Separate from booking so ops can batch pickups. Requires a shipment
        already booked by POST /orders/{id}/shipment.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Pickup requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  pickupBookedAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: No shipment has been booked for this order, or the stored shipment id is unusable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The courier refused the pickup request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The courier integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/addresses:
    get:
      tags: [Addresses]
      summary: List the customer's saved addresses
      description: Default address first, then most recently updated.
      responses:
        "200":
          description: Saved addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  addresses:
                    type: array
                    items:
                      $ref: "#/components/schemas/Address"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags: [Addresses]
      summary: Save a new shipping address
      description: >
        The first address a customer saves becomes their default by
        definition, and setting `isDefault` clears the flag on the previous
        one in the same transaction. Capped at 10 saved addresses per
        account: generous for a household, low enough that the list stays
        usable and cannot be abused as storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressRequest"
      responses:
        "201":
          description: Created address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "400":
          description: Missing name, address line or city, or a malformed phone or pincode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          description: The saved-address limit has been reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/addresses/{id}:
    put:
      tags: [Addresses]
      summary: Update one of the customer's own addresses
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressRequest"
      responses:
        "200":
          description: Updated address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: No such address, or it belongs to another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Addresses]
      summary: Delete one of the customer's own addresses
      description: >
        Deleting the default address promotes the most recently updated
        remaining one, so the account is never left without a default.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: No such address, or it belongs to another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/consent:
    post:
      tags: [Privacy]
      summary: Record a DPDP consent grant or withdrawal
      description: >
        Public, because consent is captured before sign-in by the
        first-visit cookie banner. Authentication is optional and, when a
        Bearer token is present, the record is attached to that account —
        without it every record would be keyed by email only, including a
        signed-in customer's.

        A withdrawal is stored as a new row with `granted: false` rather
        than by mutating the original grant, so the history of what was
        agreed and when is never lost, which is the part an audit actually
        asks for. Each record is stamped with the privacy notice version it
        was given against; consent to an old notice does not carry forward.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordConsentRequest"
      responses:
        "200":
          description: Consent recorded, with the notice version it was recorded against
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  noticeVersion:
                    type: string
                    example: "2026-01"
        "400":
          description: No purposes supplied, or an unknown purpose
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/privacy/export:
    get:
      tags: [Privacy]
      summary: Export everything held about the signed-in customer
      description: >
        Answers the DPDP right of access with the account, orders, saved
        addresses, reviews, wishlist, full consent history and support
        requests. Served as a file download, and includes a retention
        notice explaining that order records and processing logs are kept
        for at least a year from the transaction date as Rule 8(3) of the
        DPDP Rules 2025 requires, even after an account is deleted.
      responses:
        "200":
          description: The caller's personal data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyExport"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/privacy/erase:
    post:
      tags: [Privacy]
      summary: Erase the signed-in customer's personal data
      description: >
        Honours the right to erasure within the statutory retention floor,
        which pulls in two directions: Section 8(7) requires erasure once
        the purpose is served, while Rule 8(3) requires transactional data
        and processing logs to be retained for at least a year even after
        account deletion.

        So this is not a blanket delete. Account identifiers are scrubbed
        immediately, saved addresses, wishlist and back-in-stock rows are
        deleted outright, reviews are anonymised rather than removed (the
        content is useful to other shoppers and is no longer personal data
        once detached from an identity), and order rows are minimised —
        contact details dropped, transaction record kept — until the year
        has passed, after which the retention sweep removes them. The
        erasure itself is recorded as a consent event.

        Refused while an order is in transit: the delivery address is
        needed until it arrives.
      responses:
        "200":
          description: Identifiers scrubbed and order records minimised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: "`open_orders`: an order is still in transit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenOrdersError"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/inventory/adjust:
    post:
      tags: [Inventory]
      summary: Correct stock after a count, delivery or breakage (admin)
      description: >
        Supply exactly one of `stock` (an absolute value) or `delta` (a
        relative adjustment). A delta is clamped at zero so a bad
        adjustment cannot leave negative stock. Pass `productSizeId` to
        adjust a size rather than the product. Raising stock also releases
        any waiting back-in-stock notifications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustStockRequest"
      responses:
        "200":
          description: Stock adjusted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          description: productId missing, both or neither of stock and delta supplied, or a negative absolute stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/inventory/low-stock:
    get:
      tags: [Inventory]
      summary: Items at or below their low-stock threshold (admin)
      description: >
        Covers both sizeless products and individual sizes, lowest stock
        first, capped at 200 rows. Products with trackInventory off are
        excluded — they are always available.
      responses:
        "200":
          description: Low-stock lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LowStockItem"
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/reviews:
    get:
      tags: [Reviews]
      summary: Review moderation queue (admin)
      description: >
        Newest first, capped at 200 rows. Defaults to `pending`; pass
        `status=all` to see every review. Unlike the public endpoint this
        includes the author's full name and email and any admin notes.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected, all]
            default: pending
      responses:
        "200":
          description: Reviews awaiting or past moderation
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModerationReview"
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/reviews/{id}/status:
    patch:
      tags: [Reviews]
      summary: Approve or reject a review (admin)
      description: >
        The product's rating is recomputed from its approved reviews either
        way — recomputed from scratch rather than incremented, so reversing
        a moderation decision cannot leave the aggregate drifting.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected, pending]
                adminNotes:
                  type: string
      responses:
        "200":
          description: Review moderated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
        "400":
          description: Invalid review id, or a status outside the allowed set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/refunds:
    get:
      tags: [Refunds]
      summary: List refunds for reconciliation (admin)
      description: >
        Newest first, capped at 200 rows. Rows left `pending` or `failed`
        are the manual-reconciliation queue.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, processed, failed, all]
          description: Omit or pass `all` for every refund
      responses:
        "200":
          description: Refunds
          content:
            application/json:
              schema:
                type: object
                properties:
                  refunds:
                    type: array
                    items:
                      $ref: "#/components/schemas/Refund"
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/reports/gst:
    get:
      tags: [Invoicing]
      summary: Monthly invoice report for GST return filing (admin)
      description: >
        One row per invoice raised in the month, plus summed totals an
        accountant can reconcile against a GSTR filing. Orders without an
        invoice number are excluded.
      parameters:
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            example: "2026-09"
          description: YYYY-MM; defaults to the current month
      responses:
        "200":
          description: Invoices raised in the month, with totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GSTReport"
        "400":
          description: month was not formatted YYYY-MM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/coupons:
    get:
      tags: [Coupons]
      summary: List discount codes (admin)
      responses:
        "200":
          description: Coupons, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  coupons:
                    type: array
                    items:
                      $ref: "#/components/schemas/Coupon"
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags: [Coupons]
      summary: Create a discount code (admin)
      description: >
        Codes are upper-cased and must be unique. A percentage coupon's

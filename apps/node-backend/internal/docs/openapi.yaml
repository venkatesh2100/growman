  /webhooks/razorpay:
    post:
      tags: [Webhooks]
      summary: Razorpay webhook
      description: >
        Mounted outside /api/v1 and its rate limiters, and authenticated by
        an HMAC body signature rather than a JWT — throttling a provider
        only converts a delivery into a retry.

        `x-razorpay-signature` is HMAC-SHA256 over the exact raw body,
        keyed by RAZORPAY_WEBHOOK_SECRET. That is the secret generated in
        the Razorpay dashboard when the webhook is created, and is *not*
        the API key secret used for checkout payment signatures; using the
        key secret here makes every delivery fail. Hex and base64 encodings
        are both accepted and compared in constant time.

        `x-razorpay-event-id` is unique per event and is how duplicates are
        detected. The event is claimed by inserting it into a ledger whose
        unique index on the event id makes the claim atomic: concurrent
        duplicate deliveries race on the insert, exactly one wins, and side
        effects run exactly once. A duplicate event id returns `200` with
        `duplicate: true` and is not reprocessed. A delivery whose
        `created_at` is more than 10 minutes old is discarded as a replay,
        also with `200`.

        The handler verifies, claims and acknowledges synchronously, then
        processes in the background with a 30 second budget. Razorpay
        requires a 2xx within 5 seconds and retries for 24 hours otherwise,
        so doing the work inline risked duplicate deliveries of work
        already underway.

        Events handled: payment.captured, order.paid, payment.failed,
        refund.created, refund.processed, refund.failed and
        payment.dispute.created. Anything else is recorded and
        intentionally not processed.
      security: []
      parameters:
        - in: header
          name: X-Razorpay-Signature
          required: true
          description: HMAC-SHA256 of the raw body, keyed by the dashboard webhook secret
          schema:
            type: string
        - in: header
          name: X-Razorpay-Event-Id
          required: false
          description: >
            Razorpay's unique event id, used for deduplication. When
            absent a key is derived from the event type and created_at so
            dedup still works rather than silently degrading.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: payment.captured
                created_at:
                  type: integer
                  description: Unix seconds; deliveries older than 10 minutes are discarded
                payload:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: >
            Acknowledged. `duplicate` marks an event id already seen and
            not reprocessed; `skipped: stale` marks a delivery discarded as
            a replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"
        "400":
          description: Unreadable body, missing signature header, or an unparseable payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The signature did not verify against RAZORPAY_WEBHOOK_SECRET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The event could not be recorded, so Razorpay should retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /webhooks/shiprocket:
    post:
      tags: [Webhooks]
      summary: Shiprocket shipment status webhook
      description: >
        Advances an order's shipment state so the customer's order page
        reflects reality without anyone polling the aggregator. A slow
        ticker re-polls open shipments as a backstop for missed deliveries.

        Shiprocket authenticates with a shared token in the `x-api-key`
        header rather than an HMAC signature, so it is compared against
        SHIPROCKET_WEBHOOK_TOKEN directly. When that token is unconfigured
        the request is refused with `503` rather than trusting
        unauthenticated order-state mutations.

        Deliveries are deduplicated on the AWB plus status pair, because
        Shiprocket resends scans and each pair should only move the order
        once; a repeat returns `200` with `duplicate: true`. Delivered and
        shipped statuses move the order; intermediate scans such as pending,
        pickup scheduled or RTO initiated are recorded on the event ledger
        but leave order state alone. An AWB that matches no order is
        accepted and ignored.
      security: []
      parameters:
        - in: header
          name: x-api-key
          required: true
          description: Shared secret matched against SHIPROCKET_WEBHOOK_TOKEN
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [awb]
              properties:
                awb:
                  type: string
                current_status:
                  type: string
                  example: DELIVERED
                order_id:
                  type: string
                courier_name:
                  type: string
                scan_date_time:
                  type: string
      responses:
        "200":
          description: Acknowledged, or recognised as a duplicate scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"
        "400":
          description: Unreadable body, an invalid payload, or no awb
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The x-api-key header was missing or did not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          description: SHIPROCKET_WEBHOOK_TOKEN is not configured, so webhooks are refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        default: 20
        maximum: 100
    Slug:
      in: path
      name: slug
      required: true
      schema:
        type: string
    ID:
      in: path
      name: id
      required: true
      schema:
        type: integer
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    SuccessMessage:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: go-backend
    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          description: >
            `degraded` means Redis is unreachable but the service still
            serves; only a Postgres failure yields `down`.
        service:
          type: string
          example: go-backend
        checks:
          type: object
          description: >
            Per-dependency result, each `ok`, `not configured`, or
            `error: <detail>`. `postgres_conns` carries pool usage.
          additionalProperties:
            type: string
          example:
            postgres: ok
            postgres_conns: 2 in use, 8 idle
            redis: ok
            images: ok
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: Email address or phone number
        password:
          type: string
    AuthUserSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/AuthUserSummary"
    SignupRequest:
      type: object
      required: [name, email, phone, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          minLength: 6
    GoogleAuthRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Google ID token or access token
    PhoneAuthResponse:
      type: object
      properties:
        token:
          type: string
        isNewUser:
          type: boolean
          description: True when profile completion is still required
        isNewAccount:
          type: boolean
        user:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
            phone:
              type: string
            role:
              type: string
    MeResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        emailVerified:
          type: boolean
        role:
          type: string
        address:
          type: object
          properties:
            line:
              type: string
            city:
              type: string
            state:
              type: string
            pincode:
              type: string
            country:
              type: string
            latitude:
              type: number
              nullable: true
            longitude:
              type: number
              nullable: true
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        alternatePhone:
          type: string
        addressLine:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        country:
          type: string
        latitude:
          type: number
        longitude:
          type: number
    SaveLocationRequest:
      type: object
      properties:
        addressLine:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        country:
          type: string
        latitude:
          type: number
        longitude:
          type: number
    User:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        emailVerified:
          type: boolean
        provider:
          type: string
        role:
          type: string
        addressLine:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        country:
          type: string
        latitude:
          type: number
        longitude:
          type: number
    Category:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        subcategories:
          type: array
          items:
            $ref: "#/components/schemas/Subcategory"
    Subcategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        categoryId:
          type: integer
    Brand:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
    ProductSize:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        price:
          type: number
        stock:
          type: integer
        productId:
          type: integer
        imageKeys:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: string
    Attribute:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        value:
          type: string
        productId:
          type: integer
    Product:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        fullDescription:
          type: string
        specifications:
          type: string
        taxInfo:
          type: string
        price:
          type: number
        mrp:
          type: number
        currency:
          type: string
        imageKey:
          type: string
        imageUrl:
          type: string
        status:
          type: string
        featured:
          type: boolean
        tags:
          type: array
          items:
            type: string
        stock:
          type: integer
          description: >
            Sellable quantity for products without sizes. A product with
            sizes tracks stock per size and ignores this field.
        trackInventory:
          type: boolean
          default: true
          description: >
            False means always available, for made-to-order or effectively
            unlimited items like seed packets. Such products are never
            refused for stock and never appear in the low-stock report.
        lowStockThreshold:
          type: integer
          default: 5
          description: Drives the "only N left" urgency cue and the low-stock report
        ratingAverage:
          type: number
          description: >
            Denormalised from approved reviews so list pages never join to
            them, rounded to one decimal place.
        ratingCount:
          type: integer
          description: Number of approved reviews behind ratingAverage
        hsnCode:
          type: string
          description: HSN code for GST invoicing
        gstRate:
          type: number
          description: >
            GST percentage for this product (5 means 5%). Catalogue prices
            are tax-inclusive, so this is the rate tax is extracted at, not
            added at. Zero for nil-rated live plants.
        sizeClass:
          type: string
          enum: [small, medium, large, xl]
          description: >
            Default delivery routing for the product; a size may override
            it. small and medium go by courier, large needs the Growman
            vehicle, xl is quote-only.
        bulky:
          type: boolean
        categoryId:
          type: integer
        category:
          $ref: "#/components/schemas/Category"
        subcategoryId:
          type: integer
        brandId:
          type: integer
        sizes:
          type: array
          items:
            $ref: "#/components/schemas/ProductSize"
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/Attribute"
    CreateProductRequest:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            newCategory:
              type: string
            newSubcategory:
              type: string
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    PaginatedProducts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    PaginatedOrders:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        productId:
          type: integer
        productSizeId:
          type: integer
        quantity:
          type: integer
        price:
          type: number
        name:
          type: string
        imageKey:
          type: string
        imageUrl:
          type: string
    Order:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        userId:
          type: integer
        razorpayOrderId:
          type: string
        razorpayPaymentId:
          type: string
        paymentStatus:
          type: string
          enum: [created, paid, failed, refunded, partially_refunded]
        status:
          type: string
          description: Legacy status field, kept in sync with paymentStatus and advanced by shipment events
        amount:
          type: number
        currency:
          type: string
        publicToken:
          type: string
          description: >
            Unguessable 64-hex handle for looking this order up without
            authentication, so the post-payment page works for guests.
            Returned once by /checkout/create-order. Order ids are
            sequential and must never be used for that.
        expectedDeliveryDate:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        addressLine:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        fulfillmentChannel:
          type: string
          enum: [store_pickup, courier, own_vehicle, bulk_quote]
        fulfillmentZone:
          type: string
          enum: [store_local, near, mid, far, outside, unknown]
        subtotal:
          type: number
          description: Goods value, excluding delivery. amount is the total charged.
        deliveryFee:
          type: number
        deliveryFeeWaived:
          type: boolean
        distanceKm:
          type: number
          nullable: true
        distanceSource:
          type: string
          enum: [coordinates, pincode, pincode_prefix, none]
        latitude:
          type: number
        longitude:
          type: number
        courierProvider:
          type: string
          description: Aggregator, e.g. Shiprocket
        courierService:
          type: string
          description: Carrier the aggregator picked, e.g. Delhivery
        courierCost:
          type: number
          nullable: true
          description: >
            What the courier charges Growman, captured from the live rate
            at checkout. The gap between it and deliveryFee is the delivery
            subsidy.
        shipmentId:
          type: string
          description: Aggregator shipment id, persisted before the AWB is requested
        awbNumber:
          type: string
          description: Air waybill. Once set the order can no longer be cancelled.
        trackingUrl:
          type: string
        shippedAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        pickupBookedAt:
          type: string
          format: date-time
        taxableValue:
          type: number
          description: >
            taxableValue plus taxAmount equals subtotal: catalogue prices
            are GST-inclusive, so tax is extracted rather than added.
        taxAmount:
          type: number
        invoiceNumber:
          type: string
          description: >
            Allocated on the first paid transition and stable thereafter.
            Namespaced by Indian financial year.
          example: GRW/2026-27/000123
        invoiceDate:
          type: string
          format: date-time
        couponId:
          type: integer
        couponCode:
          type: string
        discountTotal:
          type: number
        cancelledAt:
          type: string
          format: date-time
        cancelReason:
          type: string
        refundedAmount:
          type: number
        shippingAddress:
          type: string
          description: Legacy single-line address, kept for backward compatibility
        billingAddress:
          type: string
    OrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
        productSizeId:
          type: integer
        quantity:
          type: integer
        price:
          type: number
    Destination:
      type: object
      description: >
        Where the order is going. Coordinates are preferred; the pincode is
        used when the customer declines geolocation. A half-supplied or
        out-of-range coordinate pair is ignored in favour of the pincode.
      properties:
        latitude:
          type: number
        longitude:
          type: number
        pincode:
          type: string
    FulfillmentQuoteRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemRequest"
        destination:
          $ref: "#/components/schemas/Destination"
    FulfillmentOption:
      type: object
      properties:
        channel:
          type: string
          enum: [store_pickup, courier, own_vehicle, bulk_quote]
        available:
          type: boolean
        label:
          type: string
          description: Customer-facing CTA, e.g. "Visit Store"
        fee:
          type: number
        feeWaived:
          type: boolean
          description: >
            True when a fee was zeroed by the free-delivery threshold, as
            opposed to no fee applying. Distinguishes an absorbed cost from
            a genuinely free channel when measuring the delivery subsidy.
        reason:
          type: string
          description: >
            Why the option is unavailable. One of outside_delivery_radius,
            courier_not_serviceable, item_too_bulky, plant_too_large,
            too_many_plants, below_minimum_order, bulk_order; or
            quote_required on the bulk option when a quote is mandatory.
            store_pickup is never unavailable.
    FulfillmentQuote:
      type: object
      properties:
        zone:
          type: string
          enum: [store_local, near, mid, far, outside, unknown]
        distanceKm:
          type: number
          nullable: true
        distanceSource:
          type: string
          enum: [coordinates, pincode, pincode_prefix, none]
          description: >
            How the distance was established. pincode_prefix means only the
            Hyderabad-city series was recognised, placing the address in the
            metro but not at a locality.
        subtotal:
          type: number
          description: Goods value from database prices, excluding delivery
        units:
          type: integer
        maxSizeClass:
          type: string
          enum: [small, medium, large, xl]
        options:
          type: array
          items:
            $ref: "#/components/schemas/FulfillmentOption"
        recommended:
          type: string
          enum: [store_pickup, courier, own_vehicle, bulk_quote]
        storeVisitSuggested:
          type: boolean
        bulkRequired:
          type: boolean
          description: Cart is too large or valuable for self-serve checkout
        amountForFreeDelivery:
          type: number
          description: >
            Extra spend needed to cross the free-delivery threshold. Zero
            when the waiver is disabled, met, or not offered in this zone.
        estimatedDeliveryDays:
          type: integer
          description: >
            The courier's own estimate, when a live serviceability lookup
            returned one. Omitted when unknown. Growman's cost and the
            carrier that quoted it are deliberately not exposed here.
    CreateCheckoutOrderRequest:
      type: object
      required: [amount, items, customer, fulfillmentChannel]
      properties:
        amount:
          type: number
          description: >
            What the client believes the total is. Checked against the
            server's subtotal plus delivery fee to within 1 rupee and then
            replaced by the server's figure, so a disagreement is a
            409 amount_mismatch rather than a silently accepted price.
        currency:
          type: string
          example: INR
        fulfillmentChannel:
          type: string
          enum: [store_pickup, courier, own_vehicle]
          description: >
            Required. The option the customer picked from /checkout/quote.
            bulk_quote is rejected here — bulk orders are priced by sales.
            Omitting it is a 400 fulfillment_channel_required: this field is
            what triggers the server-side repricing, so it cannot be
            optional.
        latitude:
          type: number
        longitude:
          type: number
        verificationToken:
          type: string
          description: >
            The 64-hex proof from /checkout/verify-email-otp. Required for
            guests, consumed here, single-use, and valid only for the email
            it was issued against. Signed-in callers are already verified
            by their JWT and may omit it.
        couponCode:
          type: string
          description: >
            Re-evaluated server-side against database prices; any discount
            the client claims is ignored.
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemRequest"
        customer:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            phone:
              type: string
              description: 10-digit Indian mobile starting 6-9
            addressLine:
              type: string
            city:
              type: string
            state:
              type: string
            pincode:
              type: string
    VerifyPaymentRequest:
      type: object
      required: [razorpay_payment_id]
      properties:
        razorpay_payment_id:
          type: string
        razorpay_signature:
          type: string
          description: >
            Required. HMAC-SHA256 of "<razorpay_order_id>|<payment_id>"
            keyed by the Razorpay API key secret, as the checkout callback
            supplies it. Hex or base64.
        orderId:
          type: integer
          description: >
            Growman's own order id, and the preferred way to identify the
            order: the browser callback's values are attacker-controlled,
            and the signature is checked against the razorpay_order_id
            stored at creation time rather than the one posted.
        razorpay_order_id:
          type: string
          description: Fallback lookup when orderId is not supplied
    RazorpayCreateResponse:
      type: object
      properties:
        id:
          type: string
          description: Razorpay order id
        amount:
          type: integer
          description: Amount in paise
        currency:
          type: string
        status:
          type: string
        orderId:
          type: integer
          description: Local database order id
        publicToken:
          type: string
          description: >
            Opaque 64-hex handle, returned only here, that lets a guest
            read the order back from GET /order?token= and download its
            invoice.
        subtotal:
          type: number
        deliveryFee:
          type: number
        fulfillmentChannel:
          type: string
        discount:
          type: number
          description: Present only when a coupon was applied
        couponCode:
          type: string
          description: Present only when a coupon was applied
    CheckoutChannelRequiredError:
      type: object
      properties:
        error:
          type: string
          enum: [fulfillment_channel_required]
        reason:
          type: string
          example: Choose a delivery option before placing the order.
    CheckoutEmailNotVerifiedError:
      type: object
      properties:
        error:
          type: string
          enum: [email_not_verified]
        reason:
          type: string
          example: Please verify your email address before placing the order.
    CheckoutQuoteConflict:
      type: object
      description: >
        Returned when the chosen channel is no longer available or the
        amount disagrees with the server's. The current quote comes back so
        the client can re-present the options.
      properties:
        error:
          type: string
          enum: [channel_unavailable, amount_mismatch]
        reason:
          type: string
          description: Why the channel is unavailable; set for channel_unavailable only
        expectedAmount:
          type: number
          description: The server's total; set for amount_mismatch only
        quote:
          $ref: "#/components/schemas/FulfillmentQuote"
    OutOfStockError:
      type: object
      description: >
        `items` lists the offending lines when the shortfall is caught
        before payment. When the reservation itself loses the race for the
        last units, `reason` names the line instead.
      properties:
        error:
          type: string
          enum: [out_of_stock]
        reason:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: integer
              productSizeId:
                type: integer
              name:
                type: string
              requested:
                type: integer
              available:
                type: integer
    CouponRejectedError:
      type: object
      properties:
        error:
          type: string
          enum: [coupon_rejected]
        reason:
          type: string
          description: Customer-facing copy explaining the refusal
          example: Add 500 more to use this code.
    NotCancellableError:
      type: object
      properties:
        error:
          type: string
          enum: [not_cancellable]
        reason:
          type: string
    OpenOrdersError:
      type: object
      properties:
        error:
          type: string
          enum: [open_orders]
        reason:
          type: string
    WebhookAck:
      type: object
      properties:
        success:
          type: boolean
        duplicate:
          type: boolean
          description: Present and true when this event id had already been claimed
        skipped:
          type: string
          enum: [stale]
          description: Present when the delivery was discarded as a replay
    Review:
      type: object
      description: A customer's rating of a product, as stored.
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
        comment:
          type: string
        productId:
          type: integer
        userId:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        status:
          type: string
          enum: [pending, approved, rejected]
          description: Only approved reviews are public or counted towards a product's rating
        verifiedPurchase:
          type: boolean
          description: Set when the author has a paid order containing this product
        imageKeys:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: string
          description: Resolved URLs, computed from imageKeys
        adminNotes:
          type: string
    CreateReviewRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
          maxLength: 140
        comment:
          type: string
          maxLength: 4000
        imageKeys:
          type: array
          maxItems: 5
          items:
            type: string
          description: >
            Keys from /images/upload. For plants these are the most useful
            part of a review, since buyers want to see real delivered size
            and condition.
    PublicReview:
      type: object
      description: >
        A review as shown on a product page. Reviewer identity is reduced
        to a first name, falling back to "Growman customer".
      properties:
        id:
          type: integer
        rating:
          type: integer
        title:
          type: string
        comment:
          type: string
        author:
          type: string
        verifiedPurchase:
          type: boolean
        images:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    ProductReviewsResponse:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/PublicReview"
        ratingAverage:
          type: number
        ratingCount:
          type: integer
        histogram:
          type: array
          description: Approved review counts per star rating, highest first
          items:
            type: object
            properties:
              rating:
                type: integer
              count:
                type: integer
    ModerationReview:
      type: object
      description: A review in the admin queue, with the author's full identity.
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        rating:
          type: integer
        title:
          type: string
        comment:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        verifiedPurchase:
          type: boolean
        authorName:
          type: string
        authorEmail:
          type: string
        createdAt:
          type: string
          format: date-time
        adminNotes:
          type: string
    BackInStockRequest:
      type: object
      description: A restock-notification subscription, which doubles as a demand signal.
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        productId:
          type: integer
        productSizeId:
          type: integer
        email:
          type: string
          format: email
        userId:
          type: integer
        notifiedAt:
          type: string
          format: date-time
          description: Set once the restock email has been sent; unset rows are the pending queue
    BackInStockRequestBody:
      type: object
      required: [productId, email]
      properties:
        productId:
          type: integer
        productSizeId:
          type: integer
        email:
          type: string
          format: email
    AdjustStockRequest:
      type: object
      required: [productId]
      properties:
        productId:
          type: integer
        productSizeId:
          type: integer
          description: Adjust this size rather than the product's own stock
        stock:
          type: integer
          minimum: 0
          description: Absolute value. Supply exactly one of stock or delta.
        delta:
          type: integer
          description: Relative adjustment, clamped so stock cannot go negative
        reason:
          type: string
          description: Recorded in the audit log alongside the acting admin
    LowStockItem:
      type: object
      properties:
        productId:
          type: integer
        productSizeId:
          type: integer
        name:
          type: string
          description: Includes the size label when the row is a size
        slug:
          type: string
        stock:
          type: integer
        threshold:
          type: integer
          description: The product's lowStockThreshold
    Coupon:
      type: object
      required: [code, type]
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        code:
          type: string
          maxLength: 32
          description: Stored upper-cased and unique
        description:
          type: string
        type:
          type: string
          enum: [percentage, fixed, free_shipping]
        value:
          type: number
          description: >
            Percent for percentage (1-100), rupees for fixed, ignored for
            free_shipping.
        maxDiscount:
          type: number
          description: Caps a percentage coupon's rupee value. Zero means no cap.
        minSubtotal:
          type: number
          description: >
            Tested against the part of the cart the coupon applies to, not
            the whole cart, so a scoped code is judged fairly.
        usageLimit:
          type: integer
          description: Global redemption cap. Zero means unlimited.
        perUserLimit:
          type: integer
          default: 1
          description: Per-account cap, matched by user id when signed in and by email for guests
        usageCount:
          type: integer
          readOnly: true
          description: >
            Incremented conditionally inside the order transaction, so
            concurrent checkouts cannot exceed usageLimit.
        categoryIds:
          type: array
          items:
            type: string
          description: Empty applies to the whole cart; otherwise only lines in these categories count
        productIds:
          type: array
          items:
            type: string
        firstOrderOnly:
          type: boolean
          description: Restricts the code to customers with no paid orders
        startsAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        active:
          type: boolean
    CouponDiscount:
      type: object
      description: The discount the server is willing to honour for a code against a cart.
      properties:
        code:
          type: string
        type:
          type: string
          enum: [percentage, fixed, free_shipping]
        amount:
          type: number
          description: Rupees off the goods subtotal, never more than the eligible subtotal
        freeShipping:
          type: boolean
          description: Waives the delivery fee instead of discounting the goods
        description:
          type: string
    ValidateCouponRequest:
      type: object
      required: [code, items]
      properties:
        code:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemRequest"
        email:
          type: string
          format: email
          description: Identifies a guest for per-customer usage caps; ignored when a Bearer token is present
    CreateRefundRequest:
      type: object
      properties:
        amount:
          type: number
          description: Zero or omitted refunds the full remaining balance
        reason:
          type: string
          enum:
            - customer_cancelled
            - damaged
            - wrong_item
            - out_of_stock
            - delivery_failed
            - other
          default: other
        notes:
          type: string
          description: Free text, used to carry detail for reason `other`
        restock:
          type: boolean
          default: false
          description: >
            Returns the order's units to inventory. Off by default: a plant
            refunded as damaged is usually not resellable.
    Refund:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        orderId:
          type: integer
        razorpayRefundId:
          type: string
          description: Empty between writing the local row and the provider answering
        razorpayPaymentId:
          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [pending, processed, failed]
          description: >
            Advanced to a terminal state by the refund webhooks, which are
            authoritative. Rows left pending or failed are the
            manual-reconciliation queue.
        reason:
          type: string
        notes:
          type: string
        initiatedBy:
          type: integer
          description: Admin user id; absent for system-initiated refunds such as a cancellation
        processedAt:
          type: string
          format: date-time
    Address:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userId:
          type: integer
        label:
          type: string
          example: Home
        name:
          type: string
        phone:
          type: string
        addressLine:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        isDefault:
          type: boolean
    AddressRequest:
      type: object
      required: [name, phone, addressLine, city, pincode]
      properties:
        label:
          type: string
          example: Home
        name:
          type: string
        phone:
          type: string
          description: 10-digit Indian mobile starting 6-9
        addressLine:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
          description: 6 digits, not starting with 0
        latitude:
          type: number
        longitude:
          type: number
        isDefault:
          type: boolean
          description: Setting this clears the flag on the previous default
    ConsentRecord:
      type: object
      description: >
        One consent event. A withdrawal is a new row with granted false,
        never a mutation of the original, so the history is an audit trail.
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        userId:
          type: integer
        email:
          type: string
        purpose:
          type: string
          enum: [essential, analytics, marketing, personalisation]
        granted:
          type: boolean
        noticeVersion:
          type: string
          description: The privacy notice this consent was given against
          example: "2026-01"
        ip:
          type: string
        userAgent:
          type: string
    RecordConsentRequest:
      type: object
      required: [purposes]
      properties:
        email:
          type: string
          format: email
          description: >
            Identifies an anonymous visitor so a later withdrawal can be
            honoured. Ignored in favour of the token's user when signed in.
        purposes:
          type: object
          description: >
            Purpose to granted. `essential` covers what is needed to run
            the shop and cannot be withdrawn while an order is open.
          additionalProperties:
            type: boolean
          example:
            essential: true
            analytics: true
            marketing: false
    PrivacyExport:
      type: object
      properties:

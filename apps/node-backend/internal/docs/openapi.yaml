  /api/v1/dootha-waitlist:
    post:
      tags: [Dootha Waitlist]
      summary: Join the Dootha Care device waiting list
      description: >
        Public, rate limited to 5 sign-ups per IP per 10 minutes. A repeat
        sign-up from the same mobile number updates the existing entry. The
        details are emailed to WAITLIST_EMAIL.
      security: []
      requestBody:
